name: Test

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      # TestProject targets net6.0, so the net6.0 runtime is installed next to the 8.0 SDK.
      # Tests do not need a real version: skip GitVersion (it fails on branches without a full SemVer tag).
      - name: Test
        run: >
          dotnet test TestProject/TestProject.csproj -c Release
          -p:DisableGitVersionTask=true -p:Version=0.0.0
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
